name: ARM64 Build and Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  ROBOT_MODEL: ELF3
  PACKAGE_NAME: bxi_rl_controller_ros2_example
  PACKAGE_TARGET_PATH: /opt/bxi/bxi_rl_controller_ros2_example
  BXI_ROS2_REF: arm64

jobs:
  build-and-release:
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/sloretz/ros:humble-desktop-full
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Mark Workspace as Safe Git Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate Version Tag
        run: |
          git fetch --force --tags
          VERSION="$(git tag --points-at "$GITHUB_SHA" --sort=-creatordate | head -n1)"
          if [ -z "${VERSION}" ]; then
            TIME_TAG=$(date +'%y%m%d')
            BASE_TAG="v${TIME_TAG}"
            VERSION="${BASE_TAG}"
            if git tag -l "${BASE_TAG}" | grep -qx "${BASE_TAG}"; then
              SUFFIX=1
              while git tag -l "${BASE_TAG}-${SUFFIX}" | grep -qx "${BASE_TAG}-${SUFFIX}"; do
                SUFFIX=$((SUFFIX + 1))
              done
              VERSION="${BASE_TAG}-${SUFFIX}"
            fi
          fi
          echo "tag_name=${VERSION}" >> "$GITHUB_ENV"

      - name: Install ccache
        run: |
          sudo sed -i \
            -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|http://ports.ubuntu.com/ubuntu-ports|https://ports.ubuntu.com/ubuntu-ports|g' \
            /etc/apt/sources.list
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-arm64-ccache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-arm64-ccache-

      - name: Fetch bxi_ros2_pkg
        run: |
          mkdir -p /opt/bxi
          git clone --depth 1 --branch "$BXI_ROS2_REF" \
            https://github.com/bxirobotics/bxi_ros2_pkg.git /opt/bxi/bxi_ros2_pkg

      - name: Build Controller Package
        run: |
          bash -c "
            set -e
            source /opt/ros/humble/setup.bash
            source /opt/bxi/bxi_ros2_pkg/setup.bash
            mkdir -p ${PACKAGE_TARGET_PATH}
            colcon build --merge-install --install-base ${PACKAGE_TARGET_PATH} --cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=On \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -Wall -Wextra -Wpedantic
          "

      - name: Install RKNN Conversion Tools
        run: |
          python3 -m pip install --no-cache-dir torch==2.4.0
          python3 -m pip install --no-cache-dir \
            rknn-toolkit2==2.3.2 \
            onnx==1.16.1 numpy==1.26.4 \
            onnxruntime==1.23.2 opencv-python==4.10.0.84

      - name: Build RK3588 Models
        run: |
          python3 tools/build_rknn_release.py \
            --mods "${PACKAGE_TARGET_PATH}/share/bxi_example_py_elf3/mods"
          python3 tools/build_rknn_release.py \
            --mods "${PACKAGE_TARGET_PATH}/share/bxi_example_py_elf3/mods" --check

      - name: Bundle RKNN Lite and Native Runtime
        run: |
          RKNN_DIR="${PACKAGE_TARGET_PATH}/runtime/rknn"
          mkdir -p "$RKNN_DIR"
          python3 -m pip download --no-deps --only-binary=:all: \
            --dest "$RKNN_DIR" rknn-toolkit-lite2==2.3.2
          curl --http1.1 -fsSL --retry 3 --connect-timeout 20 --max-time 120 \
            --speed-time 30 --speed-limit 1024 \
            https://raw.githubusercontent.com/airockchip/rknn-toolkit2/v2.3.2/rknpu2/runtime/Linux/librknn_api/aarch64/librknnrt.so \
            -o "$RKNN_DIR/librknnrt.so"
          curl --http1.1 -fsSL --retry 3 --connect-timeout 20 --max-time 120 \
            --speed-time 30 --speed-limit 1024 \
            https://raw.githubusercontent.com/airockchip/rknn-toolkit2/v2.3.2/LICENSE \
            -o "$RKNN_DIR/LICENSE"
          cd "$RKNN_DIR"
          echo 'd31fc19c85b85f6091b2bd0f6af9d962d5264a4e410bfb536402ec92bac738e8  librknnrt.so' | sha256sum -c -
          echo '821e80c95e6838308c133915660b1a6ae78bb8d079b2cbbd46a02dae61192d33  rknn_toolkit_lite2-2.3.2-cp310-cp310-manylinux_2_17_aarch64.manylinux2014_aarch64.whl' | sha256sum -c -

      - name: Stage Runtime Dependency Installer
        run: |
          bash -n deploy_environment.sh
          install -m 0755 deploy_environment.sh \
            "${PACKAGE_TARGET_PATH}/deploy_environment.sh"
          install -m 0644 requirement.txt \
            "${PACKAGE_TARGET_PATH}/requirement.txt"
          "${PACKAGE_TARGET_PATH}/deploy_environment.sh" --help >/dev/null
          test -x "${PACKAGE_TARGET_PATH}/deploy_environment.sh"
          test -r "${PACKAGE_TARGET_PATH}/requirement.txt"

      - name: Write Package Metadata
        run: |
          printf '%s\n' "${{ env.tag_name }}" | tee "${PACKAGE_TARGET_PATH}/.version" >/dev/null
          chmod 444 "${PACKAGE_TARGET_PATH}/.version"

      - name: Package Artifact
        run: |
          ARTIFACT="${PACKAGE_NAME}_${{ env.tag_name }}.tar.gz"
          tar --exclude='*.build.lock' -czvf "${ARTIFACT}" -C /opt/bxi "${PACKAGE_NAME}"
          tar -tzf "${ARTIFACT}" | grep -Fx \
            "${PACKAGE_NAME}/deploy_environment.sh"
          tar -tzf "${ARTIFACT}" | grep -Fx \
            "${PACKAGE_NAME}/requirement.txt"
          MODEL_ROOT="${PACKAGE_TARGET_PATH}/share/bxi_example_py_elf3/mods"
          MODEL_COUNT="$(find "$MODEL_ROOT" -type f -name '*.onnx' | wc -l)"
          test "$MODEL_COUNT" -gt 0
          test "$(tar -tzf "${ARTIFACT}" | grep -c '\.rknn$')" -eq "$MODEL_COUNT"
          test "$(tar -tzf "${ARTIFACT}" | grep -c '\.rknn.build.json$')" -eq "$MODEL_COUNT"
          tar -tzf "${ARTIFACT}" | grep -Fx \
            "${PACKAGE_NAME}/runtime/rknn/librknnrt.so"
          tar -tzf "${ARTIFACT}" | grep -Fx \
            "${PACKAGE_NAME}/runtime/rknn/LICENSE"
          sha256sum "${ARTIFACT}" > "${ARTIFACT}.sha256"

      - name: Prepare Release Artifact
        run: |
          RELEASE_ARTIFACT="${PACKAGE_NAME}_${{ env.tag_name }}_arm64.tar.gz"
          cp "${PACKAGE_NAME}_${{ env.tag_name }}.tar.gz" "${RELEASE_ARTIFACT}"
          sha256sum "${RELEASE_ARTIFACT}" > "${RELEASE_ARTIFACT}.sha256"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bxi_rl_controller_ros2_example_arm64_package
          path: |
            bxi_rl_controller_ros2_example_${{ env.tag_name }}_arm64.tar.gz
            bxi_rl_controller_ros2_example_${{ env.tag_name }}_arm64.tar.gz.sha256
          retention-days: 7

      - name: SCP Upload Package Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: bxi_rl_controller_ros2_example_${{ env.tag_name }}.tar.gz,bxi_rl_controller_ros2_example_${{ env.tag_name }}.tar.gz.sha256
          target: ${{ secrets.DEPLOY_PATH }}/arm64/${{ env.PACKAGE_NAME }}

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          name: "Release ${{ env.tag_name }}"
          files: |
            bxi_rl_controller_ros2_example_${{ env.tag_name }}_arm64.tar.gz
            bxi_rl_controller_ros2_example_${{ env.tag_name }}_arm64.tar.gz.sha256
          generate_release_notes: true
