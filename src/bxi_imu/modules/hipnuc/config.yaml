# HiPNUC module configuration.
# The port name has no numeric suffix, so it has priority 0.
imu_module:
  ros__parameters:
    driver: hipnuc
    port: /dev/ttyIMU
    baudrate: 921600
    frame_id: imu_link
    imu_topic: /hardware/imu_data
    euler_topic: /euler_data
    magnetic_topic: /magnetic_data
    temperature_topic: /temp_data
    pressure_topic: /pressure_data
    # HiPNUC installation already matches the robot coordinate system.
    axis_mapping: "identity"
    imu_frequency_hz: 500.0
    # 500 Hz => 2 ms period; timeout threshold is 5 ms (2.5 periods).
    imu_timeout_multiplier: 2.5
    imu_enabled: true
    quaternion_norm_tolerance: 0.1
    euler_enabled: false
    magnetic_enabled: false
    temperature_enabled: false
    pressure_enabled: false
