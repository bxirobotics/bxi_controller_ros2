# ELF3 joint metadata. Set motor_model to a key in motor_models.yaml.
# An unconfigured joint uses the default 90 C torque limit (75 C test stop).
# position_limit_rad comes from data/elf3.xml (simulation/software limits), not MIT encoding.
# max_command_torque_nm is a per-joint hardware setting; null means not documented.
robot: elf3
# Expected number of joints using each motor model (including head joints).
# Keep these counts independent of the joints list so edits are checked.
motor_model_counts:
  BXI_50: 10
  BXI_50L: 4
  BXI_70: 10
  BXI_85: 7
joints:
  waist_y_joint: {motor_model: BXI_70, position_limit_rad: [-0.5236, 0.5236], max_command_torque_nm: null}
  waist_x_joint: {motor_model: BXI_70, position_limit_rad: [-0.2618, 0.2618], max_command_torque_nm: null}
  waist_z_joint: {motor_model: BXI_85, position_limit_rad: [-2.8798, 2.8798], max_command_torque_nm: null}

  l_hip_y_joint: {motor_model: BXI_85, position_limit_rad: [-2.8798, 2.8798], max_command_torque_nm: null}
  l_hip_x_joint: {motor_model: BXI_85, position_limit_rad: [-0.48869, 3.0543], max_command_torque_nm: null}
  l_hip_z_joint: {motor_model: BXI_70, position_limit_rad: [-2.8798, 2.8798], max_command_torque_nm: null}
  l_knee_y_joint: {motor_model: BXI_85, position_limit_rad: [-0.087266, 2.618], max_command_torque_nm: null}
  l_ankle_y_joint: {motor_model: BXI_50L, position_limit_rad: [-0.87266, 0.7854], max_command_torque_nm: null}
  l_ankle_x_joint: {motor_model: BXI_50L, position_limit_rad: [-0.34907, 0.34907], max_command_torque_nm: null}

  r_hip_y_joint: {motor_model: BXI_85, position_limit_rad: [-2.8798, 2.8798], max_command_torque_nm: null}
  r_hip_x_joint: {motor_model: BXI_85, position_limit_rad: [-3.0543, 0.48869], max_command_torque_nm: null}
  r_hip_z_joint: {motor_model: BXI_70, position_limit_rad: [-2.8798, 2.8798], max_command_torque_nm: null}
  r_knee_y_joint: {motor_model: BXI_85, position_limit_rad: [-0.087266, 2.618], max_command_torque_nm: null}
  r_ankle_y_joint: {motor_model: BXI_50L, position_limit_rad: [-0.87266, 0.7854], max_command_torque_nm: null}
  r_ankle_x_joint: {motor_model: BXI_50L, position_limit_rad: [-0.34907, 0.34907], max_command_torque_nm: null}

