  l_shoulder_x_joint: {motor_model: BXI_70, position_limit_rad: [-0.34907, 3.0543], max_command_torque_nm: null}
  l_shoulder_z_joint: {motor_model: BXI_50, position_limit_rad: [-2.8798, 2.8798], max_command_torque_nm: null}
  l_elbow_y_joint: {motor_model: BXI_70, position_limit_rad: [-0.95993, 1.6581], max_command_torque_nm: null}
  l_wrist_x_joint: {motor_model: BXI_50, position_limit_rad: [-2.8798, 2.8798], max_command_torque_nm: null}
